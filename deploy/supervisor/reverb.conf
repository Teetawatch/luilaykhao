; Supervisor program for Laravel Reverb (the WebSocket server).
;
; Copied from production 2026-10-12, where it had only ever existed on the
; server.
;
; Two directions, two sets of settings — don't mix them up:
;   - Where Reverb *listens* is --host/--port below. REVERB_PORT in .env does
;     NOT change it.
;   - Where Laravel *publishes* is REVERB_HOST/PORT/SCHEME in .env, and must be
;     this process directly: 127.0.0.1 / 8080 / http. Going through nginx on
;     443 with REVERB_SCHEME=http got every realtime event rejected with
;     "400 plain HTTP request was sent to HTTPS port".
;   - Apps and the web reach it through nginx `location /app` on 443
;     (deploy/nginx/luilaykhao.conf).
;
; Check with: sudo -u www-data php artisan reverb:check
;
; Changing REVERB_HOST/PORT/SCHEME needs config:clear + horizon:terminate (the
; workers publish), not a Reverb restart. Restarting Reverb drops every open
; connection for a moment; only do it after changing REVERB_APP_* or this file.
;
; Install:
;   sudo cp deploy/supervisor/reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update

[program:reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/luilaykhao/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/luilaykhao/storage/logs/reverb.log
stopwaitsecs=3600
