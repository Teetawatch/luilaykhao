; Supervisor program for Laravel Horizon.
;
; Horizon manages its own pool of queue workers AND powers the /horizon
; dashboard. It is the ONLY queue consumer: do not also run a plain
; `queue:work` program (on prod it was called laravel-worker). A queue:work
; without --queue only works `default`, and its code goes stale after a deploy
; that only restarts Horizon.
;
; Which queues get worked is config/horizon.php (`default`, `reminders`, `sms`)
; — a queue missing there is never processed, silently. HorizonQueuesTest
; guards it; `php artisan ops:doctor` shows each queue's backlog.
;
; Install (Ubuntu/Debian):
;   sudo apt-get install -y supervisor
;   # stop and remove any plain queue:work program first, e.g.:
;   sudo supervisorctl stop 'laravel-worker:*'
;   sudo mv /etc/supervisor/conf.d/laravel-worker.conf /etc/supervisor/conf.d/laravel-worker.conf.disabled
;   sudo cp deploy/supervisor/luilaykhao-horizon.conf /etc/supervisor/conf.d/
;   # edit the paths/user below to match the server, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start luilaykhao-horizon
;
; After every deploy Horizon must restart to pick up new code — deploy/deploy.sh
; does it (php artisan horizon:terminate; supervisor starts it again).
;
; Adjust: the project path (/var/www/luilaykhao) and the user (www-data).
; Worker counts / balancing are configured in config/horizon.php, NOT here —
; Horizon runs as a single supervised process (numprocs=1).

[program:luilaykhao-horizon]
process_name=%(program_name)s
command=php /var/www/luilaykhao/artisan horizon
directory=/var/www/luilaykhao
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/luilaykhao/storage/logs/horizon.log
stopwaitsecs=3600
startsecs=1
