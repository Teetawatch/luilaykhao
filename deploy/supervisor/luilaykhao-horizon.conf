; Supervisor program for Laravel Horizon.
;
; Horizon manages its own pool of queue workers AND powers the /horizon
; dashboard, so it REPLACES the plain luilaykhao-worker (queue:work) program —
; do not run both, or jobs will be processed twice.
;
; Install (Ubuntu/Debian):
;   sudo apt-get install -y supervisor
;   # stop and remove the old plain worker first:
;   sudo supervisorctl stop luilaykhao-worker:*
;   sudo rm -f /etc/supervisor/conf.d/luilaykhao-worker.conf
;   sudo cp deploy/supervisor/luilaykhao-horizon.conf /etc/supervisor/conf.d/
;   # edit the paths/user below to match the server, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start luilaykhao-horizon
;
; After every deploy, tell Horizon to gracefully restart so it picks up new code:
;   php artisan horizon:terminate
;
; Adjust: the project path (/var/www/luilaykhao) and the user (www-data).
; Worker counts / balancing are configured in config/horizon.php, NOT here —
; Horizon runs as a single supervised process (numprocs=1).

[program:luilaykhao-horizon]
process_name=%(program_name)s
command=php /var/www/luilaykhao/artisan horizon
directory=/var/www/luilaykhao
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/luilaykhao/storage/logs/horizon.log
stopwaitsecs=3600
startsecs=1
