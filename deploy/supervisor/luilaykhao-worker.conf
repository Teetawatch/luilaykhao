; Supervisor program for the Luilaykhao queue worker.
;
; Install (Ubuntu/Debian):
;   sudo apt-get install -y supervisor
;   sudo cp deploy/supervisor/luilaykhao-worker.conf /etc/supervisor/conf.d/
;   # edit the paths/user below to match the server, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start luilaykhao-worker:*
;
; After every deploy, reload the long-running workers so they pick up new code:
;   php artisan queue:restart
;
; Adjust: the project path (/var/www/luilaykhao), the user (www-data) and
; numprocs (how many parallel workers).

[program:luilaykhao-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/luilaykhao/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/luilaykhao
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/luilaykhao/storage/logs/worker.log
stopwaitsecs=3600
startsecs=1
