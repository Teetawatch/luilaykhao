# Nginx server block for the Luilaykhao web app (Laravel + Vue SPA).
#
# Install (Ubuntu/Debian):
#   sudo cp deploy/nginx/luilaykhao.conf /etc/nginx/sites-available/luilaykhao
#   sudo ln -s /etc/nginx/sites-available/luilaykhao /etc/nginx/sites-enabled/
#   # edit server_name, the root path and the PHP-FPM socket below to match
#   # the server, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Brotli needs the ngx_brotli module. It is NOT built into stock nginx.
#   - Ubuntu 22.04+: sudo apt-get install -y libnginx-mod-http-brotli-filter
#     libnginx-mod-http-brotli-static  (loads the modules automatically)
#   - Otherwise build ngx_brotli and load_module it from nginx.conf.
# If brotli is unavailable, delete the `brotli` block below — gzip alone still
# cuts the transfer of our JS/CSS by ~65%.
#
# TLS is assumed to be terminated here (or by Certbot's managed block). The gzip
# and brotli directives apply regardless.

server {
    listen 80;
    listen [::]:80;
    server_name luilaykhao.com www.luilaykhao.com;

    root /var/www/luilaykhao/public;
    index index.php;

    charset utf-8;

    # ── Compression ──────────────────────────────────────────────────────
    # gzip: always available. Compress text assets on the fly.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;                       # emit "Vary: Accept-Encoding" for caches
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # brotli: better ratio than gzip on JS/CSS. Requires ngx_brotli (see header).
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Static build assets ──────────────────────────────────────────────
    # Vite writes content-hashed filenames (app-D9545idP.js), so they can be
    # cached forever — a new deploy produces a new name. Serving them straight
    # from disk skips PHP entirely.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Locally-stored uploads (/storage → storage/app/public) ───────────
    # Serve the file straight from disk while it still exists. Once it has been
    # copied to R2 and pruned (`php artisan media:migrate-to-r2 --prune`), the
    # file is gone and the request 301-redirects to the R2 equivalent so old
    # content that embeds absolute /storage/… URLs never 404s. Done here (not in
    # Laravel) because the framework already owns a /storage/{path} route for the
    # private 'local' disk — a redirect route there would collide with it.
    #
    # Replace media.luilaykhao.com with your R2_PUBLIC_URL host. The rewrite
    # strips the /storage/ prefix: /storage/media/x.jpg → https://<host>/media/x.jpg
    # (the R2 object key has no /storage/ prefix). `^~` makes this win over the
    # image-extension regex below so a missing image redirects instead of 404ing.
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @r2_media;
    }
    location @r2_media {
        rewrite ^/storage/(.*)$ https://media.luilaykhao.com/$1 permanent;
    }

    # Other long-lived static files (favicons, fonts, videos served locally…)
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|eot|mp4)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ── Laravel front controller ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Match the PHP-FPM version/socket installed on the server.
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (e.g. .env, .git).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/luilaykhao_error.log;
    access_log /var/log/nginx/luilaykhao_access.log;
}
